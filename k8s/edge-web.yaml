apiVersion: v1
kind: Namespace
metadata:
  name: demo-edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-web-html
  namespace: demo-edge
  labels:
    app: edge-web
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <title>Edge Web Demo</title>
    </head>
    <body>
      <main>
        <h1>Edge Web Demo</h1>
        <p>Served by the <strong>edge-web</strong> deployment (2 replicas) in the <code>demo-edge</code> namespace.</p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-web
  namespace: demo-edge
  labels:
    app: edge-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-web
  template:
    metadata:
      labels:
        app: edge-web
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: edge-web-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: edge-web-html
          configMap:
            name: edge-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: edge-web
  namespace: demo-edge
  labels:
    app: edge-web
spec:
  type: ClusterIP
  selector:
    app: edge-web
  ports:
    - name: http
      port: 80
      targetPort: http
